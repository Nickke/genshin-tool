<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genshin Tool</title>
<style>
:root{
  --bg:#0f172a;--surf:#1e293b;--card:#263044;--border:#334155;
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-lt:#1e3a5f;
  --green:#22c55e;--green-d:#14532d;
  --red:#ef4444;--red-d:#7f1d1d;
  --amber:#f59e0b;--amber-d:#78350f;
  --purple:#a855f7;
  --text:#f1f5f9;--muted:#94a3b8;--muted2:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f172a);padding:14px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #1e3a8a;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px #0008}
.hdr h1{font-size:19px;font-weight:700}
.hdr p{font-size:11px;color:#93c5fd}
.hdr-stats{margin-left:auto;display:flex;gap:12px}
.pill{background:#ffffff14;border:1px solid #ffffff22;border-radius:20px;padding:5px 14px;text-align:center}
.pill .v{font-size:17px;font-weight:700}
.pill .l{font-size:10px;color:#93c5fd}
.upbar{background:var(--surf);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px}
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green-d);color:var(--green);border:1px solid var(--green)}
.upmsg{color:var(--muted);font-size:12px}
.upmsg.ok{color:var(--green)}
.tabs{display:flex;gap:3px;padding:10px 20px 0;background:var(--surf);border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;border-radius:7px 7px 0 0;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted);transition:all .15s}
.tab.on{background:var(--blue);color:#fff}
.tab:hover:not(.on){background:var(--card);color:var(--text)}
.wrap{padding:18px 20px;max-width:1300px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.spanel{display:none}.spanel.on{display:block}
#gtabs{margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 14px;text-align:center}
.scard .big{font-size:34px;font-weight:800;line-height:1}
.scard .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.ccard:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0006;border-color:var(--blue)}
.ccard.iss{border-color:#ef444444}
.cav{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;overflow:hidden;position:relative}
.cav img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.cav .init{position:relative;z-index:1;pointer-events:none}
.cinf{padding:9px}
.cname{font-size:12px;font-weight:700;margin-bottom:3px}
.csub{font-size:10px;color:var(--muted)}
.badges{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.b{font-size:10px;padding:2px 6px;border-radius:12px;font-weight:600}
.bok{background:#14532d;color:#4ade80}
.bwarn{background:#78350f;color:#f59e0b}
.berr{background:#7f1d1d;color:#ef4444}
.bblu{background:#1e3a5f;color:#60a5fa}
.ebanner{padding:5px 9px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.pcard{background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:12px}
.phdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pav{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #ffffff22;position:relative;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.pav img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.pbody{padding:12px 14px;border-top:1px solid var(--border)}
.irow{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;margin-bottom:4px;font-size:12px;font-weight:600}
.ired{background:#7f1d1d33;border:1px solid #ef444444;color:#f87171}
.iamb{background:#78350f33;border:1px solid #f59e0b44;color:#fbbf24}
.trow{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
.tbox{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid}
.tmax{background:#14532d44;border-color:#22c55e44;color:#4ade80}
.tok{background:#78350f44;border-color:#f59e0b44;color:#fbbf24}
.tbad{background:#7f1d1d44;border-color:#ef444444;color:#f87171}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.fhdr{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.fbody{padding:12px 14px;border-top:1px solid var(--border);display:none}
.fbody.open{display:block}
.tteam{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tchunk{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tav{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;transition:border-color .15s}
.tav img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.tchunk:hover .tav{border-color:var(--blue)}
.tname{font-size:10px;color:var(--muted);text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twarn{position:absolute;bottom:-2px;right:-2px;background:#f59e0b;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:8px;z-index:2}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.dhdr{padding:11px 14px;display:flex;align-items:center;gap:10px}
.days{display:flex;gap:3px}
.day{padding:2px 5px;border-radius:4px;font-size:9px;font-weight:600}
.don{background:#1d4ed8;color:#fff}
.dtoday{background:var(--blue);color:#fff;box-shadow:0 0 8px #3b82f6}
.doff{background:var(--border);color:var(--muted2)}
.dchars{display:flex;gap:7px;flex-wrap:wrap;padding:8px 14px}
.dch{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.dch .av{width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.dch .av img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.dch .nm{font-size:9px;color:var(--muted);text-align:center;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:#000a;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--surf);border:1px solid var(--border);border-radius:14px;width:100%;max-width:840px;overflow:hidden;position:relative}
.mclose{position:absolute;top:10px;right:10px;background:#ffffff14;border:none;color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.mhdr{padding:18px 20px;display:flex;align-items:center;gap:14px}
.mav{width:90px;height:90px;border-radius:50%;overflow:hidden;border:3px solid #ffffff22;position:relative;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex-shrink:0}
.mav img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.mbody{padding:14px 20px}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);margin:14px 0 7px;border-bottom:1px solid var(--border);padding-bottom:5px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcell{border-radius:8px;padding:11px;text-align:center;border:1px solid}
.tcell.mx{border-color:#22c55e44;background:#14532d44}
.tcell.ok{border-color:#f59e0b44;background:#78350f44}
.tcell.bd{border-color:#ef444444;background:#7f1d1d44}
.tcell .tnum{font-size:30px;font-weight:800;line-height:1}
.tcell .tlbl{font-size:10px;color:var(--muted);margin-bottom:3px}
.tcell .tst{font-size:10px;font-weight:700;margin-top:3px}
.artbl{width:100%;border-collapse:collapse;font-size:11px}
.artbl td{padding:5px 8px;border-bottom:1px solid var(--border)}
.artbl td:first-child{color:var(--muted);width:80px}
.artbl .aset{font-weight:600}
.artbl .abest{color:var(--green)}
.artbl .asub{color:var(--muted2);font-size:10px}
.artbl .amiss{color:var(--red);font-weight:600}
.bcard{background:var(--blue-lt);border:1px solid #3b82f622;border-radius:8px;padding:11px}
.brow{display:grid;grid-template-columns:100px 1fr;gap:5px;margin-bottom:4px;font-size:11px}
.brow .bl{color:var(--muted)}.brow .bv{color:var(--text)}
.warn-box{background:#78350f22;border:1px solid #f59e0b44;border-radius:7px;padding:7px 11px;margin-top:6px}
.warn-box p{font-size:11px;color:#fbbf24;margin-bottom:2px}
.stabs{display:flex;gap:3px;margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select,.filters input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px}
.filters input{flex:1;min-width:150px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* ── artifact cards hoyolab-style ─────────────────────────────────────────── */
.artcards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.artcard{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px;display:flex;flex-direction:column}
.artcard.acempty{align-items:center;justify-content:center;min-height:150px;border-style:dashed}
.artcard-sub{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.artcard-sub .ask{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artcard-sub .asv{font-size:9px;color:var(--text);font-weight:700;white-space:nowrap;margin-left:3px}
</style>
</head>
<body>

<div class="hdr">
  <div style="font-size:26px">🎮</div>
  <div><h1 id="hTitle">Genshin Tool</h1><p id="hSub" style="color:#93c5fd;font-size:11px">Carica JSON per iniziare</p></div>
  <div class="hdr-stats">
    <div class="pill"><div class="v" id="hLv">—</div><div class="l">Lv90</div></div>
    <div class="pill"><div class="v" id="hCr">—</div><div class="l">👑 Crown</div></div>
    <div class="pill"><div class="v" id="hMo">—</div><div class="l">Mora</div></div>
  </div>
</div>

<div class="upbar">
  <input type="file" id="fi" accept=".json" style="display:none">
  <button class="btn btn-blue" onclick="document.getElementById('fi').click()">📂 JSON Completo</button>
  <button class="btn btn-green" id="btnP" onclick="loadP()" disabled>➕ JSON Parziale</button>
  <button class="btn" id="btnTG" style="background:#064e3b;color:#6ee7b7;border:1px solid #6ee7b755" onclick="toggleTravelerGender()" title="Genere Traveler">🧑 Traveler ♂</button>
  <span class="upmsg" id="umsg">Carica il JSON di Inventory Kamera per iniziare</span>
</div>


<div class="tabs">
  <button class="tab on" id="mainTabIK" onclick="sw('ik',this)">⚙ Config IK</button>
  <button class="tab" id="mainTabGA" onclick="sw('ga',this)">📖 Guida Account</button>
  <button class="tab" id="mainTabEV" onclick="sw('ev',this)">📅 Events</button>
</div>

<div class="wrap">
  <div id="ik" class="panel on"><div id="ikc"></div></div>
  <div id="ev" class="panel"><div id="evc"></div></div>
  <div id="ga" class="panel">
    <div class="stabs" id="gtabs">
      <button class="tab on" onclick="sg('ov',this)">📊 Overview</button>
      <button class="tab" onclick="sg('pr',this)">🎯 Priorità</button>
      <button class="tab" onclick="sg('ch',this)">👤 Personaggi</button>
      <button class="tab" onclick="sg('do',this)">🗺 Domini</button>
      <button class="tab" onclick="sg('ab',this)">⚔ Abisso</button>
      <button class="tab" onclick="sg('te',this)">🎭 Teatro</button>
      <button class="tab" onclick="sg('iv',this)">🎒 Inventario</button>
    </div>
    <div id="ov" class="spanel on"><div id="ovc"><p style="color:var(--muted);text-align:center;padding:40px">Carica un JSON per iniziare.</p></div></div>
    <div id="pr" class="spanel">
      <div class="filters" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <span style="font-size:12px;color:var(--muted);align-self:center">Piani Abisso:</span>
        <select id="flMin" onchange="rPr()" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px">
          <option value="1">Da Piano 1</option><option value="2">Da Piano 2</option><option value="3">Da Piano 3</option><option value="4">Da Piano 4</option><option value="5">Da Piano 5</option><option value="6">Da Piano 6</option><option value="7">Da Piano 7</option><option value="8">Da Piano 8</option><option value="9" selected>Da Piano 9</option><option value="10">Da Piano 10</option><option value="11">Da Piano 11</option><option value="12">Da Piano 12</option>
        </select>
        <select id="flMax" onchange="rPr()" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px">
          <option value="1">A Piano 1</option><option value="2">A Piano 2</option><option value="3">A Piano 3</option><option value="4">A Piano 4</option><option value="5">A Piano 5</option><option value="6">A Piano 6</option><option value="7">A Piano 7</option><option value="8">A Piano 8</option><option value="9">A Piano 9</option><option value="10">A Piano 10</option><option value="11">A Piano 11</option><option value="12" selected>A Piano 12</option>
        </select>
        <span style="font-size:12px;color:var(--muted);align-self:center;margin-left:8px">Ordina:</span>
        <select id="prSort" onchange="rPr()" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px">
          <option value="ab">Abisso + Issues</option>
          <option value="sev">Gravità Issue</option>
          <option value="lv">Livello (asc)</option>
        </select>
      </div>
      <div id="prc"></div>
    </div>
    <div id="ch" class="spanel">
      <div class="filters">
        <select id="cf" onchange="rc()"><option value="a">Tutti</option><option value="i">Con Issues</option><option value="9">Lv90</option><option value="p">Perfetti</option><option value="s">Arma Starter</option></select>
        <select id="cs" onchange="rc()"><option value="l">Per Livello</option><option value="n">Per Nome</option><option value="e">Per Elemento</option><option value="i">Per Issues</option></select>
        <input id="cq" placeholder="🔍 Cerca..." oninput="rc()">
      </div>
      <div id="chfex" style="display:flex;gap:6px;flex-wrap:wrap;padding:4px 14px 8px"></div>
      <div id="chg" class="cgrid"></div>
    </div>
    <div id="do" class="spanel">
      <div class="stabs" id="dtabs">
        <button class="tab on" onclick="sd('db',this)">👹 Boss Sett.</button>
        <button class="tab" onclick="sd('dt',this)">📚 Talenti</button>
        <button class="tab" onclick="sd('da',this)">🏺 Manufatti</button>
        <button class="tab" onclick="sd('dw',this)">⚔ Armi</button>
      </div>
      <div id="db"></div><div id="dt" style="display:none"></div>
      <div id="da" style="display:none"></div><div id="dw" style="display:none"></div>
    </div>
    <div id="ab" class="spanel"><div id="abc"></div></div>
    <div id="te" class="spanel"><div id="tec"></div></div>
    <div id="iv" class="spanel">
      <div class="stabs" id="ivtabs">
        <button class="tab on" onclick="si('iw',this)">⚔ Armi</button>
        <button class="tab" onclick="si('ia',this)">🏺 Artefatti</button>
        <button class="tab" onclick="si('idv',this)">📦 Sviluppo</button>
        <button class="tab" onclick="si('imt',this)">🌿 Materiali</button>
      </div>
      <div id="iw"></div>
      <div id="ia" style="display:none"></div>
      <div id="idv" style="display:none"></div>
      <div id="imt" style="display:none"></div>
    </div>
  </div>
</div>

<div class="modal" id="mod" onclick="if(event.target===this)cm()">
  <div class="mbox">
    <button class="mclose" onclick="cm()">×</button>
    <div id="mc"></div>
  </div>
</div>

<script>
var G=null, RD=null, IK_ELEM=null, IK_C3B=null;
var TRAVELER_GENDER="m"; // "m"=PlayerBoy "f"=PlayerGirl
var DOM_FILTER="needed"; // "needed"=solo con issues "all"=tutti
var IK_PLAYER_NAME=""; var IK_PLAYER_UID="";

// ── DATI ──────────────────────────────────────────────────────────────────────

o","Ningguang":"geo","Gorou":"geo","AratakiItto":"geo","YunJin":"geo","Navia":"geo","Chiori":"geo","Kachina":"geo","Zibai":"geo","Illuga":"geo","Linnea":"geo","Xilonen":"geo","Traveler":"anemo","TravelerHydro":"hydro","TravelerPyro":"pyro","TravelerDendro":"dendro"};
var EC={hydro:"#60a5fa",pyro:"#f87171",cryo:"#bfdbfe",electro:"#c084fc",dendro:"#4ade80",anemo:"#6ee7b7",geo:"#fbbf24"};

   phases:["Fase 1 — Solo Geo: Attacchi Geo standard. Fase relativamente gestibile per memorizzare i pattern.","Fase 2 (~67% HP) — Assorbimento Settimanale: Assorbe un elemento (Pyro/Hydro/Cryo/Electro, cambia ogni reset). Guadagna 60% resist. a quell'elemento. CONTROLLA quale elemento è questa settimana prima di costruire il team.","Fase 3 (~33% HP) — Aggressivo: Attacchi dual-element. ATTENZIONE: se un attacco elementale ti colpisce SENZA SCUDO → sei Segnato (danno elementale continuo per tutta la fight). Scudo Zhongli previene la Marca."],
   team:["Neuvillette","Furina","Nahida","Zhongli"],
   team2:["Mavuika","Bennett","Xingqiu","Zhongli"],

  {k:"MudraOfTheMaleficGeneral",b:"Raiden Shogun (Boss)",d:"Piano di Euthymia, Inazuma",drops:["MudraOfTheMaleficGeneral","TearsOfTheCalamitousGod","TheMeaningOfAeons"],chars:["Cyno","KamisatoAyato","TravelerDendro","KukiShinobu","Collei","Nilou","Candace","YaeMiko","ShikanoinHeizou","Tighnari"],

  {k:"PuppetStrings",b:"Scaramouche (Signore Eterno)",d:"Joururi Workshop, Sumeru",drops:["PuppetStrings","MirrorOfMushin","DakasBell"],chars:["Dehya","Nahida","Faruzan","Alhaitham","Layla","Mika","Xilonen","Wanderer","Yaoyao","Sethos"],

   team:["Neuvillette","Furina","Nahida","Zhongli"],
   team2:["Alhaitham","Nahida","Xingqiu","Furina"],

   phases:["Fase 1 — Guardiano Indebolito: Attacchi standard Dendro. Attacca il cuore esposto durante i momenti di vulnerabilità. Schiva gli slam a terra e i proiettili sferici.","Fase 2 — Proteggi il Cuore: ONDATE di nemici attaccano il Cuore delle Oasi. UCCIDI i nemici il più velocemente possibile per riempire il metro (se colpiscono il Cuore il metro scende). Non abbandonare il Cuore — il fight fallisce se il Cuore viene distrutto.","Fase 3 — Piena Potenza: Attacchi Dendro più aggressivi. Alta resist. Dendro (lui è Dendro). Schiva gli AoE a terra con sfere multiple."],

var GAME_DATA_UPDATE_URL = "";

function getLastAbyssReset() {
  var now = new Date();
  var resetDay = 16;
  var m = now.getMonth(), y = now.getFullYear();
  if (now.getDate() < resetDay) { m--; if (m < 0) { m = 11; y--; } }
  return new Date(y, m, resetDay);
}

function isAbyssDataStale() {
  if (!DATA_LAST_UPDATED) return false;
  var lastUpdate = new Date(DATA_LAST_UPDATED);
  return lastUpdate < getLastAbyssReset();
}

function getAbyssStaleDays() {
  var reset = getLastAbyssReset();
  var lastUpdate = new Date(DATA_LAST_UPDATED);
  if (lastUpdate >= reset) return 0;
  return Math.ceil((reset - lastUpdate) / 86400000);
}

async function fetchGameData() {
  if (!GAME_DATA_UPDATE_URL) return;
  try {
    var resp = await fetch(GAME_DATA_UPDATE_URL, { cache: "no-cache" });
    if (!resp.ok) return;
    var data = await resp.json();
    if (Array.isArray(data.floors9to12) && data.floors9to12.length === 4) {
      FLOORS = FLOORS.slice(0, 8).concat(data.floors9to12);
    }
    if (data.events) Object.assign(GENSHIN_EVENTS, data.events);
    if (data.teatro) Object.assign(TEATRO_SEASON, data.teatro);
    if (data.lastUpdated) DATA_LAST_UPDATED = data.lastUpdated;
    console.log("[GenshinTool] Dati aggiornati automaticamente:", DATA_LAST_UPDATED);
  } catch(e) {
    console.log("[GenshinTool] Auto-aggiornamento non disponibile:", e.message);
  }
}

// Tabella costi talento per step
var TAL_COST=[
  {t1:3,t2:0,t3:0},{t1:0,t2:2,t3:0},{t1:0,t2:4,t3:0},{t1:0,t2:6,t3:0},
  {t1:0,t2:9,t3:0},{t1:0,t2:0,t3:4},{t1:0,t2:0,t3:6},{t1:0,t2:0,t3:12},
  {t1:0,t2:0,t3:16}
]; // step 0=1→2, step 1=2→3, ... step 8=9→10

function talCostRange(from,to){
  var c={t1:0,t2:0,t3:0};
  for(var lv=from;lv<to;lv++){
    var step=lv-1; // lv1→2 = step0
    if(step>=0&&step<TAL_COST.length){c.t1+=TAL_COST[step].t1;c.t2+=TAL_COST[step].t2;c.t3+=TAL_COST[step].t3;}
  }
  return c;
}

function issueActionHint(iss, c){
  if(iss.t==="t"){
    // Talenti: calcola materiali necessari
    var book=c.meta&&c.meta.book||"";
    var lines=[];
    ["auto","skill","burst"].forEach(function(tk){
      var cur=c.tj[tk]; var goal=c.tgts[tk];
      if(cur>=goal)return;
      var cost=talCostRange(cur,goal);
      var have=G?bookMats(book):[0,0,0];
      var need=[cost.t1,cost.t2,cost.t3];
      var BOOK_PFX=["📘 Teaching of ","📗 Guide to ","📚 Philosophies of "];
      var parts=[];
      ["T1","T2","T3"].forEach(function(t,i){
        if(need[i]>0){
          var col=have[i]>=need[i]?"#4ade80":"#f87171";
          var lbl=book?BOOK_PFX[i]+book:t;
          parts.push({label:lbl,have:have[i],need:need[i],col:col});
        }
      });
      if(parts.length)lines.push({tk:tk,cur:cur,goal:goal,parts:parts,book:book});
    });
    return {type:"t",lines:lines};
  }
  if(iss.t==="a"){
    var domInfo=null;
    if(c.meta&&c.meta.bestS){
      var bs=c.meta.bestS;
      for(var i=0;i<ADOMS.length;i++){if(ADOMS[i].s&&ADOMS[i].s.toLowerCase().indexOf(bs.substring(0,8).toLowerCase())>=0){domInfo=ADOMS[i];break;}}
    }
    return {type:"a",dom:domInfo};
  }
  if(iss.t==="w"){
    return {type:"w", wep:(c.meta&&c.meta.wep&&c.meta.wep[0])||""};
  }
  if(iss.t==="b"){
    var bk=(c.meta&&c.meta.boss)||"";
    var bqty=G?(G.mats[bk]||0):0;
    var blv=(c.lv||1);var bneed=(blv>=90)?0:(blv>=80?6:(blv>=70?12:15));
    return {type:"b",bkey:bk,have:bqty,need:bneed};
  }
  return null;
}

function renderIssueAction(hint, parent){
  if(!hint)return;
  var box=div("");box.style.cssText="background:#ffffff08;border:1px solid #ffffff14;border-radius:6px;padding:6px 9px;margin-top:4px;font-size:11px";
  if(hint.type==="t"){
    var lbl=div("","Azione immediata — libri talento necessari:");lbl.style.cssText="font-weight:700;color:#4ade80;margin-bottom:4px";ap(box,lbl);
    hint.lines.forEach(function(line){
      var row=div("",line.tk[0].toUpperCase()+line.tk.slice(1)+" "+line.cur+"→"+line.goal+(line.book?" ("+line.book+")":"")+":");
      row.style.cssText="color:var(--muted);margin-bottom:2px";ap(box,row);
      var pr=div("");pr.style.cssText="display:flex;gap:8px;flex-wrap:wrap;padding-left:8px";ap(box,pr);
      line.parts.forEach(function(p){
        var s=span("",p.label+": hai "+p.have+" / servono "+p.need);
        s.style.cssText="color:"+p.col+";font-weight:600";ap(pr,s);
      });
    });
  }else if(hint.type==="a"){
    var lbl2=div("","Azione immediata:");lbl2.style.cssText="font-weight:700;color:#4ade80;margin-bottom:2px";ap(box,lbl2);
    var msg=hint.dom?"Farm il dominio "+hint.dom.n+" ("+hint.dom.loc+") per gli artefatti "+hint.dom.s:"Equipa artefatti mancanti";
    ap(box,span("",msg)).style.cssText="color:var(--muted)";
  }else if(hint.type==="w"){
    var lbl3=div("","Azione immediata:");lbl3.style.cssText="font-weight:700;color:#4ade80;margin-bottom:2px";ap(box,lbl3);
    var wmsg="Sostituisci l'arma starter"+(hint.wep?" → consigliata: "+hint.wep:"");
    ap(box,span("",wmsg)).style.cssText="color:#fbbf24";
  }else if(hint.type==="b"){
    var lbl4=div("","Materiale boss necessario:");lbl4.style.cssText="font-weight:700;color:#a78bfa;margin-bottom:2px";ap(box,lbl4);
    var brow=div("");brow.style.cssText="display:flex;align-items:center;gap:8px";ap(box,brow);
    if(hint.bkey)ap(brow,materialImg(hint.bkey,26));
    var bkShort=hint.bkey?hint.bkey.replace(/([A-Z])/g,' $1').trim():"?";
    var bokCol=hint.have>=hint.need?"#4ade80":(hint.have>0?"#fbbf24":"#f87171");
    var bstat=hint.need===0?"Non serve (Lv90)":"Hai "+hint.have+" / servono "+hint.need;
    ap(brow,span("",bkShort+" — "+bstat)).style.cssText="color:"+bokCol+";font-size:11px";
  }
  ap(parent,box);
}

  var urls=[
    "https://enka.network/ui/UI_AvatarIcon_"+n+".png",
    "https://upload-os-bbs.mihoyo.com/game_record/genshin/character_icon/UI_AvatarIcon_"+n+".png",
    "https://api.ambr.top/assets/UI/UI_AvatarIcon_"+n+".png"
  ];
  function tryNext(i){
    if(i>=urls.length)return;
    var img=new Image();
    img.referrerPolicy="no-referrer";
    img.onload=function(){onLoad(img);};
    img.onerror=function(){tryNext(i+1);};
    img.src=urls[i];
  }
  tryNext(0);
}

function weaponImg(key, sz) {
  var img = document.createElement("img");
  img.width = sz || 40; img.height = sz || 40;
  img.style.cssText = "object-fit:contain;border-radius:6px;background:#ffffff0a;flex-shrink:0";
  img.referrerPolicy = "no-referrer";
  var iconName = WEAPON_ICON_OVERRIDE[key] || null;
  var urls = iconName ? [
    "https://enka.network/ui/"+iconName+".png",
    "https://api.ambr.top/assets/UI/"+iconName+".png",
    "https://gi.yatta.moe/assets/UI/equip/"+iconName+".png"
  ] : [
    "https://gi.yatta.moe/assets/UI/equip/"+key+".png",
    "https://api.ambr.top/assets/UI/UI_EquipIcon_"+key+".png",
    "https://enka.network/ui/UI_EquipIcon_"+key+".png"
  ];
  function tryNext(i){
    if(i>=urls.length){img.style.opacity="0.2";img.style.filter="grayscale(1)";return;}
    var t=new Image();
    t.referrerPolicy="no-referrer";
    t.onload=function(){img.src=urls[i];};
    t.onerror=function(){tryNext(i+1);};
    t.src=urls[i];
  }
  tryNext(0);
  return img;
}

function artifactImg(setKey, slotKey, sz) {
  var img = document.createElement("img");
  img.width = sz||36; img.height = sz||36;
  img.style.cssText = "object-fit:contain;border-radius:6px;background:#ffffff0a;flex-shrink:0";
  img.referrerPolicy = "no-referrer";
  var slotId = ARTIFACT_SLOT_IDX[slotKey||"flower"] || 4;
  var urls = [];
  // Use kamera_artifact_icons (game-accurate icons from IK database) if available
  var kaIcon = KAMERA_ARTIFACT_ICONS && KAMERA_ARTIFACT_ICONS[setKey] && KAMERA_ARTIFACT_ICONS[setKey][slotKey||"flower"];
  if(kaIcon){
    urls.push("https://enka.network/ui/"+kaIcon+".png");
    urls.push("https://api.ambr.top/assets/UI/"+kaIcon+".png");
    urls.push("https://gi.yatta.moe/assets/UI/"+kaIcon+".png");
  } else {
    var setId = ARTIFACT_SET_MAP[setKey];
    if(setId){
      urls.push("https://enka.network/ui/UI_RelicIcon_"+setId+"_"+slotId+".png");
      urls.push("https://api.ambr.top/assets/UI/UI_RelicIcon_"+setId+"_"+slotId+".png");
      urls.push("https://gi.yatta.moe/assets/UI/relics/"+setId+"_"+slotId+".png");
    }
    // Fallback by set name for unmapped sets
    urls.push("https://gi.yatta.moe/assets/UI/relics/"+setKey+"_"+slotId+".png");
  }
  var idx=0;
  function tryNext(){
    if(idx>=urls.length){img.style.opacity="0.25";return;}
    img.src=urls[idx++];img.onerror=tryNext;
  }
  tryNext();
  return img;
}

// Avatar: crea div con img via loadAv (3 CDN fallback)
function av(k,sz){
  sz=sz||48;
  var bg=eb(k); var fg=ec(k);
  var d=document.createElement("div");
  d.style.cssText="width:"+sz+"px;height:"+sz+"px;border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:"+bg+";font-size:"+Math.round(sz*0.38)+"px;font-weight:800;color:"+fg+";flex-shrink:0";
  d.textContent=k.substring(0,2).toUpperCase();
  d.setAttribute("data-avkey",k);
  d.setAttribute("data-avsz",sz);
  loadAv(d,k,function(img){
    if(!d.isConnected)return;
    d.textContent="";
    img.style.cssText="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0";
    d.appendChild(img);
  });
  return d;
}

function tgt(k,con){
  var inC3B=IK_C3B?IK_C3B.has(k):(C3B.indexOf(k)>=0);
  return {
    auto:10,
    skill:inC3B?(con>=5?13:10):(con>=3?13:10),
    burst:inC3B?(con>=3?13:10):(con>=5?13:10)
  };
}

function getArts(key,artMap){
  var loc=key.startsWith("Traveler")?"Traveler":key;
  var raw=artMap[loc]||[];
  var seen={};
  raw.slice().sort(function(a,b){return (b.rarity||0)*100+(b.level||0)-(a.rarity||0)*100-(a.level||0);}).forEach(function(a){
    var s=a.slotKey||"?";
    if(!seen[s])seen[s]=a;
  });
  return Object.values(seen);
}

function normMatKey(k){return(typeof IK_DATA_MATERIALS!=="undefined"&&IK_DATA_MATERIALS[k.toLowerCase()])||k;}
function analyze(data){
  // Normalizza materials: GOOD v2 usa array [{key,count}], v1 usa object
  // IK esporta chiavi lowercase in entrambi i formati — normalizziamo sempre
  var rawMats=data.materials||{};
  var mats={};
  if(Array.isArray(rawMats)){
    rawMats.forEach(function(m){if(m&&m.key){var k=normMatKey(m.key);mats[k]=(mats[k]||0)+(m.count||0);}});
  } else {
    Object.keys(rawMats).forEach(function(k){var nk=normMatKey(k);mats[nk]=(mats[nk]||0)+(rawMats[k]||0);});
  }
  var artMap={};
  (data.artifacts||[]).forEach(function(a){
    if(!a.location)return;
    var loc=a.location;
    if(loc.startsWith("Traveler")||loc==="Aether"||loc==="Lumine") loc="Traveler";
    if(!artMap[loc])artMap[loc]=[];
    artMap[loc].push(a);
    // Also store under original key for direct lookup
    if(a.location!==loc){if(!artMap[a.location])artMap[a.location]=[];artMap[a.location].push(a);}
  });
  var wepMap={};
  function betterWep(a,b){
    if(!a)return b; if(!b)return a;
    var aS=ST.indexOf(a.key)>=0, bS=ST.indexOf(b.key)>=0;
    if(aS&&!bS)return b; if(!aS&&bS)return a;
    return((a.level||0)*10+(a.refinement||1))>=((b.level||0)*10+(b.refinement||1))?a:b;
  }
  (data.weapons||[]).forEach(function(w){
    if(!w.location)return;
    wepMap[w.location]=betterWep(wepMap[w.location],w);
    // Normalize all Traveler variants (IK may use Aether/Lumine/TravelerBoy/TravelerGirl)
    var tLoc=w.location;
    if(tLoc.startsWith("Traveler")||tLoc==="Aether"||tLoc==="Lumine"){
      wepMap["Traveler"]=betterWep(wepMap["Traveler"],w);
    }
  });
  var chars=(data.characters||[]).map(function(c){
    var key=c.key,con=c.constellation||0,lv=c.level||1;
    var t=c.talent||{};
    var tj={auto:t.auto||1,skill:t.skill||1,burst:t.burst||1};
    var tgts=tgt(key,con);
    var meta=MD[key]||{};
    var tp=meta.tp||["skill","burst"];
    var al=getArts(key,artMap);
    var wep=wepMap[key.startsWith("Traveler")?"Traveler":key]||wepMap[key]||{};
    var talMax=tp.every(function(k){return tj[k]>=(tgts[k]||10);});
    var issues=[];
    if(ST.indexOf(wep.key)>=0)issues.push({t:"w",s:"Arma starter: "+fmtName(wep.key)});
    if(al.length===0)issues.push({t:"a",s:"0 artefatti equipaggiati"});
    else if(al.length<5)issues.push({t:"a",s:al.length+"/5 artefatti (slot mancanti)"});
    if(!talMax){
      var bad=tp.filter(function(k){return tj[k]<(tgts[k]||10);}).map(function(k){return k[0].toUpperCase()+":"+tj[k]+"/"+tgts[k];});
      issues.push({t:"t",s:"Talenti: "+bad.join(", ")});
    }
    return {key:key,con:con,lv:lv,tj:tj,tgts:tgts,al:al,wep:wep,meta:meta,tp:tp,talMax:talMax,issues:issues,tier:meta.tier||5};
  });
  return {chars:chars,mats:mats,lv90:chars.filter(function(c){return c.lv===90;}),weapons:data.weapons||[],artifacts:data.artifacts||[]};
}

function merge(base,part){
  var out=JSON.parse(JSON.stringify(base));
  if(part.materials)Object.assign(out.materials,part.materials);
  if(part.characters){
    var pm={};part.characters.forEach(function(c){pm[c.key]=c;});
    out.characters=out.characters.map(function(c){return pm[c.key]?Object.assign({},c,pm[c.key]):c;});
    var ex=new Set(out.characters.map(function(c){return c.key;}));
    part.characters.forEach(function(c){if(!ex.has(c.key))out.characters.push(c);});
  }
  if(part.weapons){
    // Sostituisce le armi dei personaggi presenti nel parziale, mantiene le altre dal base
    var partLocs=new Set(part.weapons.filter(function(w){return w.location;}).map(function(w){return w.location;}));
    out.weapons=out.weapons.filter(function(w){return !w.location||!partLocs.has(w.location);});
    out.weapons=out.weapons.concat(part.weapons);
  }
  if(part.artifacts){
    var locs=new Set((part.characters||[]).map(function(c){return c.key;}));
    out.artifacts=out.artifacts.filter(function(a){return !a.location||!locs.has(a.location);});
    out.artifacts=out.artifacts.concat(part.artifacts);
  }
  return out;
}

function dayBadges(days,selDay){
  // selDay=0 → Tutti: evidenzia solo oggi in verde; selDay>0 → evidenzia giorno selezionato
  var tod=new Date().getDay();var todN=tod===0?7:tod;
  return DAYS.map(function(d,i){
    var dn=i+1;
    var on=days.indexOf(dn)>=0;
    var isHl=selDay>0?(dn===selDay):(dn===todN);
    var cls=isHl&&on?"dtoday":on?"don":"doff";
    return '<span class="day '+cls+'">'+d+'</span>';
  }).join("");
}

function rPr(){
  if(!G)return;
  var cont=document.getElementById("prc");clr(cont);

  var maxF=parseInt(document.getElementById("flMax").value)||12;
  var srt=(document.getElementById("prSort")||{value:"ab"}).value||"ab";
  if(minF>maxF){var tmp=minF;minF=maxF;maxF=tmp;}

  // Calcola team reali dal roster per ogni piano nel range
  var fteam=new Set();
  var fmap={}; // key → [{f, half}]
  FLOORS.filter(function(fl){return fl.f>=minF&&fl.f<=maxF;}).forEach(function(fl){
    var teams=buildFloorTeams(fl);
    (teams.h1||[]).forEach(function(k){
      fteam.add(k);
      if(!fmap[k])fmap[k]=[];
      fmap[k].push({f:fl.f,half:"1\xaa"});
    });
    (teams.h2||[]).forEach(function(k){
      fteam.add(k);
      if(!fmap[k])fmap[k]=[];
      fmap[k].push({f:fl.f,half:"2\xaa"});
    });
  });

  function sc(c){
    if(srt==="lv") return -c.lv;
    var s=0;
    if(srt==="sev"){
      c.issues.forEach(function(i){s+=i.t==="t"?8:15;});
      if(c.lv<80)s+=10;
      return s;
    }

    if(fteam.has(c.key)){
      s+=50;
      (fmap[c.key]||[]).forEach(function(e){s+=(e.f-8)*3;});
    }
    c.issues.forEach(function(i){s+=i.t==="t"?8:15;});
    if(c.lv<80)s+=10;

  ap(cont,banner);

  sorted.forEach(function(c,i){

    var pav2=div("pav");pav2.style.background=bg2;pav2.style.color=fg2;pav2.textContent=c.key.substring(0,2).toUpperCase();ap(ph,pav2);
    loadAv(pav2,c.key,function(img){pav2.textContent="";img.style.cssText="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0";pav2.appendChild(img);});

function materialImg(key, sz) {
  var size=sz||28;
  var wrap=document.createElement("span");
  wrap.style.cssText="display:inline-flex;align-items:center;justify-content:center;width:"+size+"px;height:"+size+"px;border-radius:4px;background:#ffffff0a;flex-shrink:0;overflow:hidden;position:relative;vertical-align:middle";
  var img=document.createElement("img");
  img.width=size; img.height=size;
  img.style.cssText="object-fit:contain;width:100%;height:100%;position:absolute;top:0;left:0";
  img.referrerPolicy="no-referrer";
  var icon=(KAMERA_MATERIAL_ICONS&&KAMERA_MATERIAL_ICONS[key])||MATERIAL_ICON_MAP[key];
  var urls=[];
  if(icon){
    urls=[
      "https://enka.network/ui/"+icon+".png",
      "https://api.ambr.top/assets/UI/"+icon+".png",
      "https://gi.yatta.moe/assets/UI/"+icon+".png"
    ];
  }
  urls=urls.concat([
    "https://enka.network/ui/"+key+".png",
    "https://gi.yatta.moe/assets/UI/"+key+".png",
    "https://api.ambr.top/assets/UI/UI_ItemIcon_"+key+".png"
  ]);
  var idx=0;
  function tryNext(){
    if(idx>=urls.length){
      img.style.display="none";
      var fb=document.createElement("span");
      var abbr=key.replace(/([A-Z])/g," $1").trim();
      fb.textContent=abbr.substring(0,3).toUpperCase();
      fb.title=key;
      fb.style.cssText="font-size:"+(size<30?7:9)+"px;font-weight:700;color:#64748b;text-align:center;line-height:1;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;padding:1px";
      wrap.style.border="1px solid #334155";
      wrap.appendChild(fb);
      return;
    }
    img.src=urls[idx++];img.onerror=tryNext;
  }
  tryNext();
  wrap.appendChild(img);
  return wrap;
}

function teamDiff(team){
  if(!G||!team||!team.length)return{score:0,label:"?",col:"#888",stars:"?"};
  var total=0;
  team.forEach(function(k){
    var c=G.chars.find(function(x){return x.key===k;});
    if(!c)return;
    var t=c.tier||5;
    total+=(t>=9?3:t>=7?2:t>=5?1:0);
  });
  var max=team.length*3;
  var pct=max>0?total/max:0;
  if(pct>=0.75)return{score:3,label:"Squadra forte",col:"#4ade80",stars:"★★★"};
  if(pct>=0.45)return{score:2,label:"Squadra discreta",col:"#fbbf24",stars:"★★☆"};
  return{score:1,label:"Squadra debole",col:"#f87171",stars:"★☆☆"};
}

function charScore(c){
  if(!c)return 0;
  var lvPts=c.lv>=90?2:c.lv>=80?1.4:c.lv>=70?0.8:c.lv>=60?0.3:0;
  var wepPts=(c.wep&&c.wep.key&&ST.indexOf(c.wep.key)<0)?1:0;
  var talSum=0;
  ["auto","skill","burst"].forEach(function(tk){var cur=c.tj[tk];var tgt=c.tgts[tk]||10;talSum+=Math.min(cur/tgt,1);});
  return lvPts+wepPts+(talSum/3);
}

function salaEval(team,diffMult){
  if(!G||!team||!team.length)return{stars:"?",col:"#888",n:0,hints:[]};
  var chars=team.map(function(k){return G.chars.find(function(x){return x.key===k;});}).filter(Boolean);
  if(!chars.length)return{stars:"?",col:"#888",n:0,hints:[]};
  var total=chars.reduce(function(s,c){return s+charScore(c);},0);
  var adj=(total/(chars.length*4))/diffMult;
  var stars,col,n;
  if(adj>=0.68){stars="★★★";col="#4ade80";n=3;}
  else if(adj>=0.41){stars="★★☆";col="#fbbf24";n=2;}
  else{stars="★☆☆";col="#f87171";n=1;}
  var hints=[];
  chars.forEach(function(c){
    if(!c)return;
    if(c.wep&&c.wep.key&&ST.indexOf(c.wep.key)>=0)hints.push({p:100,m:"Arma reale per "+fmtName(c.key)+" (ora: "+fmtName(c.wep.key)+")"});
    if(c.lv<90)hints.push({p:90-c.lv,m:fmtName(c.key)+" → Lv90 (ora Lv"+c.lv+")"});
    var talN={auto:"Auto",skill:"Skill",burst:"Burst"};
    ["auto","skill","burst"].forEach(function(tk){var cur=c.tj[tk];var tgt=c.tgts[tk]||10;if(cur<tgt)hints.push({p:(tgt-cur)*4,m:fmtName(c.key)+" "+talN[tk]+" "+cur+"→"+tgt});});
  });
  hints.sort(function(a,b){return b.p-a.p;});
  return{stars:stars,col:col,n:n,hints:hints.slice(0,4).map(function(h){return h.m;})};
}

function minTalFor3star(team,diffMult){
  if(!G||!team||!team.length)return null;
  var chars=team.map(function(k){return G.chars.find(function(x){return x.key===k;});}).filter(Boolean);
  if(!chars.length)return null;
  var adj0=(chars.reduce(function(s,c){return s+charScore(c);},0)/(chars.length*4))/diffMult;
  if(adj0>=0.68)return null;
  for(var t=1;t<=10;t++){
    var tot=chars.reduce(function(s,c){
      var lp=c.lv>=90?2:c.lv>=80?1.4:c.lv>=70?0.8:c.lv>=60?0.3:0;
      var wp=(c.wep&&c.wep.key&&ST.indexOf(c.wep.key)<0)?1:0;
      var ts=0;
      ["auto","skill","burst"].forEach(function(tk){var eff=Math.max(c.tj[tk],t);var tgt=c.tgts[tk]||10;ts+=Math.min(eff/tgt,1);});
      return s+lp+wp+(ts/3);
    },0);
    if((tot/(chars.length*4))/diffMult>=0.68)return t;
  }
  return null;
}

function buildFloorTeams(fl){
  var needH2=!!(fl.split||fl.h2_teams);
  if(!G){
    var dt1=fl.h1_teams&&fl.h1_teams[0]?fl.h1_teams[0].slice(0,4):(fl.h1_priority||[]).slice(0,4);
    var dt2=needH2?(fl.h2_teams&&fl.h2_teams[0]?fl.h2_teams[0].slice(0,4):(fl.h2_priority||[]).slice(0,4)):[];
    return{h1:dt1,h2:dt2};
  }
  var avail=G.chars.map(function(c){return c.key;});
  var maxSt=fl.rooms?fl.rooms.length*3:9;
  function scK(k){var c=G.chars.find(function(x){return x.key===k;});return c?charScore(c):0;}
  function evalPair(h1,h2){
    if(!fl.rooms||!fl.rooms.length)return 0;
    return fl.rooms.reduce(function(s,rm){
      var e1=h1.length?salaEval(h1,rm.diff):{n:3};
      var e2=h2.length?salaEval(h2,rm.diff):{n:3};
      return s+(h2.length?Math.min(e1.n,e2.n):e1.n);
    },0);
  }
  function fillComp(comp,excluded){
    var team=[],used=excluded.slice();
    (comp||[]).forEach(function(k){
      if(team.length<4&&avail.indexOf(k)>=0&&used.indexOf(k)<0){team.push(k);used.push(k);}
    });
    if(team.length<4){
      avail.filter(function(k){return used.indexOf(k)<0;}).sort(function(a,b){return scK(b)-scK(a);})
        .forEach(function(k){if(team.length<4){team.push(k);used.push(k);}});
    }
    var cov=(comp||[]).filter(function(k){return team.indexOf(k)>=0;}).length;
    return{team:team,cov:cov};
  }
  // --- Piano con composizioni meta (piani 9-12) ---
  if(fl.h1_teams&&fl.h1_teams.length){
    var h2list=needH2&&fl.h2_teams&&fl.h2_teams.length?fl.h2_teams:[[]];
    var bestH1=null,bestH2=null,bestSt=-1,bestCov=-1;
    fl.h1_teams.forEach(function(c1){
      h2list.forEach(function(c2){
        var f1=fillComp(c1,[]);
        var f2=needH2?fillComp(c2,f1.team):{team:[],cov:0};
        var st=evalPair(f1.team,f2.team);
        var cov=f1.cov+f2.cov;
        // Preferisce: più stelle → poi più copertura originale (meno sostituti)
        if(st>bestSt||(st===bestSt&&cov>bestCov)){
          bestSt=st;bestCov=cov;bestH1=f1.team;bestH2=f2.team;
        }
      });
    });
    return{h1:bestH1||[],h2:bestH2||[]};
  }
  // --- Piano senza composizioni (piani 1-8 score-based) ---
  var byS=avail.slice().sort(function(a,b){return scK(b)-scK(a);});
  var alt1=byS.filter(function(_,i){return i%2===0;}).slice(0,4);
  var alt2=needH2?byS.filter(function(_,i){return i%2===1;}).slice(0,4):[];
  var top1=byS.slice(0,4);var top2=needH2?byS.slice(4,8):[];
  var sa=evalPair(alt1,alt2),st2=evalPair(top1,top2);
  return sa>=st2?{h1:alt1,h2:alt2}:{h1:top1,h2:top2};
}

function calcTalentFixes(){
  var fixes=[];
  if(!G)return fixes;
  G.chars.forEach(function(c){
    var inC3B=IK_C3B?IK_C3B.has(c.key):(C3B.indexOf(c.key)>=0);
    var ta={auto:c.tj.auto,skill:c.tj.skill,burst:c.tj.burst};
    var msgs=[];
    if(c.con>=3){var t3=inC3B?"burst":"skill";if(ta[t3]===10){ta[t3]=13;msgs.push(t3+":10→13 (C3)");}}
    if(c.con>=5){var t5=inC3B?"skill":"burst";if(ta[t5]===10){ta[t5]=13;msgs.push(t5+":10→13 (C5)");}}
    if(msgs.length)fixes.push({key:c.key,con:c.con,lv:c.lv,ta:ta,msgs:msgs,c:c});
  });
  return fixes;
}

function generateTalentFix(){
  if(!G){alert("Carica prima il JSON completo.");return;}
  var fixes=calcTalentFixes();
  if(!fixes.length){alert("Nessuna correzione necessaria — IK ha letto i talenti correttamente.");return;}
  var chars=fixes.map(function(x){return {key:x.key,constellation:x.con,level:x.lv,talent:x.ta};});
  var out=JSON.stringify({format:"GOOD",version:2,source:"GenshinTool TalentFix C3/C5",characters:chars},null,2);
  var blob=new Blob([out],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="genshin_talent_fix.json";a.click();
  URL.revokeObjectURL(url);
}

function matSource(key){
  // Returns {type, name, loc} for where a material comes from
  // Check talent book domains
  for(var i=0;i<TDOMS.length;i++){var td=TDOMS[i];if(td.books&&td.books.some(function(b){return key.indexOf(b)>=0;}))return{type:"talent",name:td.n,loc:td.loc,days:td.d};}
  // Check weekly bosses
  for(var j=0;j<BOSS.length;j++){var bs=BOSS[j];if(bs.drops&&bs.drops.indexOf(key)>=0)return{type:"boss",name:bs.b,loc:bs.d};}
  // Check weapon material domains
  for(var k=0;k<WDOMS.length;k++){var wd=WDOMS[k];if(key.indexOf("Decarabian")>=0||key.indexOf("BorealWolf")>=0||key.indexOf("Dandelion")>=0){if(wd.n==="Cecilia Garden")return{type:"weapon",name:wd.n,loc:wd.loc,days:wd.d};}}
  return null;
}

function downloadIKData(filename, dataObj){
  var json=JSON.stringify(dataObj,null,2);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

        var f4lbl=div("","✦ 4 Stelle — Rate Up");f4lbl.style.cssText="font-size:9px;font-weight:700;color:#c084fc;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px";ap(bc,f4lbl);

    else{ap(bc,div("","Data da confermare")).style.cssText="font-size:10px;color:var(--muted)";}
  }

  var verLbl=div("","🌍 Ver "+GENSHIN_EVENTS.version+" · aggiornato "+GENSHIN_EVENTS.lastUpdated);verLbl.style.cssText="font-size:10px;color:#60a5fa;margin-bottom:8px";ap(bsec,verLbl);
  GENSHIN_EVENTS.bannerCurrent.forEach(function(b){renderBannerCard(b,bgrid);});

  if(GENSHIN_EVENTS.bannerPhase1&&GENSHIN_EVENTS.bannerPhase1.length){
    var bp1h=div("","⏮ Fase 1 (terminata)");bp1h.style.cssText="font-size:10px;font-weight:700;color:#94a3b8;margin-top:12px;margin-bottom:8px;text-transform:uppercase";ap(bsec,bp1h);

  }

  if(GENSHIN_EVENTS.bannerNext&&GENSHIN_EVENTS.bannerNext.length){
    var bnth=div("","⏭ Prossimo Banner (stimato)");bnth.style.cssText="font-size:10px;font-weight:700;color:#60a5fa;margin-top:12px;margin-bottom:8px;text-transform:uppercase";ap(bsec,bnth);
    var bngrid=div("");bngrid.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:12px";ap(bsec,bngrid);
    GENSHIN_EVENTS.bannerNext.forEach(function(b){renderBannerCard(b,bngrid);});
  }

  // Free Character Selectors
  var freecEvs=(GENSHIN_EVENTS.events||[]).filter(function(e){return e.type==="freechar";});
  if(freecEvs.length){
    var fcsec=div("card");fcsec.style.cssText+="border-color:#22c55e44;background:#14532d11;margin-bottom:14px";ap(cont,fcsec);
    var fch=div("","🎁 Personaggi Gratuiti — Selettori 5★");fch.style.cssText="font-size:12px;font-weight:700;color:#22c55e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.7px";ap(fcsec,fch);
    freecEvs.forEach(function(ev,ei){
      var evDiv=div("");evDiv.style.cssText="margin-bottom:"+(ei<freecEvs.length-1?"20px":"0")+(ei<freecEvs.length-1?";padding-bottom:16px;border-bottom:1px solid #ffffff0a":"");ap(fcsec,evDiv);
      var evName=div("","🎴 "+ev.name);evName.style.cssText="font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px";ap(evDiv,evName);
      var evNote=div("",ev.note||"");evNote.style.cssText="font-size:10px;color:var(--muted);margin-bottom:10px";ap(evDiv,evNote);
      // Score characters
      var scored=(ev.chars||[]).map(function(key){
        var meta=MD[key];
        var owned=G&&G.chars&&G.chars.find(function(c){return c.key===key;});
        var tier=meta?(meta.tier||5):5;
        var bestCon=meta?(meta.bestCon||0):0;
        var con=owned?(owned.constellation||0):-1;
        var score,reason;
        if(con<0){score=tier*100;reason="Non ce l'hai";}
        else if(con>=6){score=tier;reason="C6 — già al massimo";}
        else if(bestCon>0&&con<bestCon){score=tier*20+(bestCon-con)*5;reason="Hai C"+con+", best cons C"+bestCon;}
        else{score=tier*10;reason="Hai C"+con+" (già ottimo)";}
        return{key:key,meta:meta,owned:owned,tier:tier,score:score,con:con,bestCon:bestCon,reason:reason};
      });
      scored.sort(function(a,b){return b.score-a.score;});
      var best=scored[0];
      // Recommendation box
      var recBox=div("");recBox.style.cssText="background:#22c55e11;border:1px solid #22c55e44;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start";ap(evDiv,recBox);
      ap(recBox,div("","★")).style.cssText="font-size:20px;color:#22c55e;flex-shrink:0;line-height:1.2";
      var rbText=div("");ap(recBox,rbText);
      ap(rbText,div("","Consigliato per questo account:")).style.cssText="font-size:10px;font-weight:700;color:#22c55e;margin-bottom:4px";
      if(!G){
        ap(rbText,div("","Carica un file JSON per la raccomandazione personalizzata.")).style.cssText="font-size:11px;color:var(--muted)";
        if(best){ap(rbText,div("","Migliore in assoluto: "+fmtName(best.key)+" (Tier "+best.tier+")")).style.cssText="font-size:11px;color:var(--text);margin-top:3px";}
      } else if(best){
        var bestRow=div("");ap(rbText,bestRow);
        bestRow.style.cssText="display:flex;align-items:center;gap:8px";
        ap(bestRow,av(best.key,32));
        var bestInfo=div("");ap(bestRow,bestInfo);
        ap(bestInfo,div("",fmtName(best.key)+" — Tier "+best.tier)).style.cssText="font-size:13px;font-weight:700;color:var(--text)";
        ap(bestInfo,div("",best.reason)).style.cssText="font-size:10px;color:#22c55e";
        if(scored.length>1&&scored[1]&&scored[1].score>best.tier){
          ap(rbText,div("","Alternativa: "+fmtName(scored[1].key)+" — "+scored[1].reason)).style.cssText="font-size:10px;color:var(--muted);margin-top:4px";
        }
      }
      // Character grid
      var cgrid=div("");cgrid.style.cssText="display:flex;gap:8px;flex-wrap:wrap";ap(evDiv,cgrid);
      scored.forEach(function(sc,idx){
        var isBest=idx===0&&G;
        var ccard=div("");ccard.style.cssText="display:flex;flex-direction:column;align-items:center;gap:3px;background:"+(isBest?"#22c55e0f":"#ffffff06")+";border:1px solid "+(isBest?"#22c55e55":"transparent")+";border-radius:10px;padding:8px 6px;width:70px;cursor:pointer;position:relative;transition:opacity .2s";
        if(G&&sc.con>=6)ccard.style.opacity="0.5";
        ccard.onclick=function(){openBannerMod(sc.key);};
        ap(ccard,av(sc.key,40));
        var cname=div("",fmtName(sc.key));cname.style.cssText="font-size:9px;color:var(--text);text-align:center;font-weight:600;line-height:1.2;width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";ap(ccard,cname);
        var cst;
        if(!G){cst=div("","T"+sc.tier);cst.style.cssText="font-size:8px;color:var(--muted);font-weight:700";}
        else if(sc.con<0){cst=div("","Nuovo ★");cst.style.cssText="font-size:8px;color:#22c55e;font-weight:700";}
        else if(sc.con>=6){cst=div("","C6 ✓");cst.style.cssText="font-size:8px;color:#94a3b8;font-weight:700";}
        else{cst=div("","C"+sc.con+"  |  T"+sc.tier);cst.style.cssText="font-size:8px;color:#60a5fa;font-weight:700";}
        ap(ccard,cst);
        if(isBest){var star=div("","★");star.style.cssText="position:absolute;top:3px;right:5px;font-size:9px;color:#22c55e";ap(ccard,star);}
        ap(cgrid,ccard);
      });
    });
  }

  // Timeline Gantt
  var tlsec=div("card");ap(cont,tlsec);
  var tlh=div("","📅 Timeline Eventi");tlh.style.cssText="font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px;text-transform:uppercase;letter-spacing:.7px";ap(tlsec,tlh);

  if(!GENSHIN_EVENTS.events||!GENSHIN_EVENTS.events.length){ap(tlsec,div("","Nessun evento disponibile")).style.cssText="font-size:12px;color:var(--muted)";return;}

  // Calcola range date
  var today=new Date();
  var rangeStart=new Date(today);rangeStart.setDate(rangeStart.getDate()-5);
  var rangeEnd=new Date(today);rangeEnd.setDate(rangeEnd.getDate()+35);
  var rangeDays=(rangeEnd-rangeStart)/(1000*60*60*24);

  // Asse date
  var axis=div("");axis.style.cssText="display:flex;margin-left:150px;margin-bottom:6px;position:relative;height:16px";ap(tlsec,axis);
  for(var d=0;d<=rangeDays;d+=5){
    var dd=new Date(rangeStart);dd.setDate(dd.getDate()+d);
    var lbl=div("",(dd.getMonth()+1)+"/"+(dd.getDate()));
    lbl.style.cssText="position:absolute;left:"+(d/rangeDays*100)+"%;font-size:9px;color:var(--muted);transform:translateX(-50%)";
    ap(axis,lbl);
  }

  // Oggi line pct
  var todayPct=((today-rangeStart)/(1000*60*60*24))/rangeDays*100;

  var evTypeColor={"combat":"#ef4444","exploration":"#22c55e","resin":"#a855f7","login":"#3b82f6","freechar":"#f59e0b","default":"#94a3b8"};

  GENSHIN_EVENTS.events.forEach(function(ev){
    var row=div("");row.style.cssText="display:flex;align-items:center;margin-bottom:6px;position:relative";ap(tlsec,row);
    var nm=div("",ev.name);nm.style.cssText="width:150px;flex-shrink:0;font-size:10px;color:var(--text);padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";ap(row,nm);

    var track=div("");track.style.cssText="flex:1;height:20px;background:#ffffff08;border-radius:4px;position:relative;overflow:hidden";ap(row,track);

    // Linea oggi
    var todayLine=div("");todayLine.style.cssText="position:absolute;left:"+todayPct+"%;top:0;bottom:0;width:1px;background:#f59e0b88;z-index:1";ap(track,todayLine);

    var evStart=new Date(ev.start);var evEnd=new Date(ev.end);
    var startPct=((evStart-rangeStart)/(1000*60*60*24))/rangeDays*100;
    var widthPct=((evEnd-evStart)/(1000*60*60*24))/rangeDays*100;
    startPct=Math.max(0,Math.min(100,startPct));
    widthPct=Math.max(1,Math.min(100-startPct,widthPct));

    var col=evTypeColor[ev.type]||evTypeColor["default"];
    var bar=div("",ev.name);bar.style.cssText="position:absolute;left:"+startPct+"%;width:"+widthPct+"%;top:2px;bottom:2px;background:"+col+"44;border-left:2px solid "+col+";border-radius:2px;font-size:9px;color:"+col+";padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center";
    ap(track,bar);
  });
}

rIK();rEvents();
</script>
